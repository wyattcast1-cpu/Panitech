<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PaniTech | Learning Platform</title>
<style>
:root{--bg:#07102b;--card:#0d1838;--card2:#101f45;--line:#24345d;--text:#f4f7ff;--muted:#aeb9d8;--accent:#16c7bb;--accent2:#0b8e99}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050b20,#081433);color:var(--text);font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#07102bf2;position:sticky;top:0;z-index:5}
.brand{font-weight:800;font-size:20px;color:#fff}.brand span{color:var(--accent)}.top small{color:var(--muted)}
.wrap{max-width:1100px;margin:auto;padding:25px 16px}.hero{padding:35px 0}.hero h1{font-size:38px;margin:0 0 8px}.hero p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 12px 35px #0004}.role{min-height:180px}.role h2{margin-top:0}.muted{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:8px;padding:10px 15px;background:var(--accent);color:#03121a;font-weight:700}.btn.secondary{background:#17264b;color:#fff;border:1px solid var(--line)}.btn.danger{background:#8d3048;color:#fff}.btn.small{padding:7px 10px;font-size:12px}
input,textarea,select{width:100%;background:#060d25;color:#fff;border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:6px;outline:0}textarea{min-height:140px;resize:vertical}
label{display:block;margin:14px 0 0;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nav button.active{background:var(--accent);color:#03121a}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
.lesson{border:1px solid var(--line);border-radius:11px;padding:14px;background:#0a1430;margin-bottom:10px}.lesson h3{margin:0 0 7px}.lesson p{color:#c8d1e8;white-space:pre-wrap;line-height:1.5;font-size:13px}.lesson img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin:10px auto}
.quiz-q{padding:14px;border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#091532}.option{display:block;margin:7px 0;padding:9px;border-radius:7px;background:#101e41}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:#9feee9}
.notice{padding:11px;border-radius:8px;background:#0a3f3c;color:#9ffff7;margin:10px 0;font-size:13px}.error{background:#4a1c2b;color:#ffc0ce}
.login{max-width:430px;margin:70px auto}.center{text-align:center}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Pani<span>Tech</span></div><small id="userLabel"></small></header>
<main id="app"></main>
</div>
<script>
const KEY="panitech_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"lessons":[],"students":[],"scores":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function notice(t,error=false){return `<div class="notice ${error?'error':''}">${esc(t)}</div>`}
function header(title,sub=""){return `<div class="section-title"><div><h2>${title}</h2>${sub?`<div class="muted">${sub}</div>`:""}</div></div>`}
function home(){
$("app").innerHTML=`<div class="wrap"><section class="hero"><h1>Maligayang pagdating sa PaniTech</h1><p>Isang simpleng digital learning platform para sa guro at mag-aaral.</p></section>
<div class="grid"><div class="card role"><h2>👨‍🏫 Guro</h2><p class="muted">Gumawa ng klase, mag-post ng aralin, mag-upload ng larawan at video, at gumawa ng quiz.</p><button class="btn" onclick="login('teacher')">Magpatuloy bilang Guro</button></div>
<div class="card role"><h2>👨‍🎓 Mag-aaral</h2><p class="muted">Sumali sa klase gamit ang join code, basahin ang aralin, at sagutan ang quiz.</p><button class="btn" onclick="login('student')">Magpatuloy bilang Mag-aaral</button></div></div></div>`}
function login(role){
$("app").innerHTML=`<div class="wrap"><div class="card login"><h2>${role==='teacher'?'Guro Login':'Mag-aaral Login'}</h2>
<label>Pangalan</label><input id="name" placeholder="${role==='teacher'?'Hal. Juan Dela Cruz':'Hal. Maria Santos'}">
<label>Section / Join Code</label><input id="code" placeholder="${role==='teacher'?'Optional':'Hal. FIL01'}">
<div class="actions"><button class="btn" onclick="enter('${role}')">Pumasok</button><button class="btn secondary" onclick="home()">Bumalik</button></div></div></div>`}
function enter(role){
let name=$("name").value.trim(); if(!name)return alert("Ilagay ang pangalan.");
if(role==="teacher"){sessionStorage.setItem("role","teacher");sessionStorage.setItem("name",name);sessionStorage.setItem("code","TEACHER");teacher()}
else{let code=$("code").value.trim().toUpperCase();if(!code)return alert("Ilagay ang join code.");sessionStorage.setItem("role","student");sessionStorage.setItem("name",name);sessionStorage.setItem("code",code);if(!db.students.some(s=>s.name===name&&s.code===code))db.students.push({name,code});save();student()}
}
function topUser(){document.getElementById("userLabel").textContent=`${sessionStorage.getItem("name")||""}`;document.querySelector(".top").onclick=()=>{}}
function logout(){sessionStorage.clear();$("userLabel").textContent="";home()}
function teacher(){
topUser();let tab="lessons";
function render(){
$("app").innerHTML=`<div class="wrap"><div class="nav">
<button class="btn ${tab==='lessons'?'active':''}" onclick="tab='lessons';render()">📚 Mga Aralin</button>
<button class="btn secondary ${tab==='add'?'active':''}" onclick="tab='add';render()">＋ Magdagdag ng Aralin</button>
<button class="btn secondary ${tab==='students'?'active':''}" onclick="tab='students';render()">👥 Mga Mag-aaral</button>
<button class="btn secondary" onclick="logout()">Logout</button></div>${tab==='lessons'?lessonManager():tab==='add'?addLesson():studentManager()}</div>`;
}
window.teacherRender=render;
function lessonManager(){return `<div class="card">${header("Mga Aralin","Lahat ng lesson na na-post ng guro.")}${db.lessons.length?db.lessons.map((l,i)=>`<div class="lesson"><div class="section-title"><h3>${esc(l.title)}</h3><button class="btn danger small" onclick="deleteLesson(${i})">Tanggalin</button></div><div class="muted">Section: ${esc(l.code)} · ${l.quiz.length} quiz item(s)</div></div>`).join(""):"<p class='muted'>Wala pang nai-post na aralin.</p>"}</div>`}
function addLesson(){return `<div class="card">${header("Bumuo ng Aralin")}
<label>Pamagat</label><input id="ltitle" placeholder="Ilagay ang pamagat ng aralin">
<label>Nilalaman ng Aralin</label><textarea id="lcontent" placeholder="Ilagay ang nilalaman..."></textarea>
<label>Cover Photo (Optional)</label><input id="photo" type="file" accept="image/*">
<label>Video URL (Optional)</label><input id="video" placeholder="https://youtube.com/...">
<label>Section / Join Code</label><input id="lcode" value="FIL01" placeholder="Hal. FIL01">
<div class="section-title" style="margin-top:22px"><h3>Interactive Quiz</h3><button class="btn small" onclick="addQ()">＋ Magdagdag</button></div>
<div id="quizList"></div><div id="formMsg"></div>
<div class="actions"><button class="btn" onclick="publishLesson()">I-post ang Aralin</button><button class="btn secondary" onclick="teacher()">Kanselahin</button></div></div>`}
window.qs=[]; function addQ(){qs.push({q:"",a:"",b:"",c:"",d:"",ans:"A"});renderQs()}
function renderQs(){let x=document.getElementById("quizList");if(!x)return;x.innerHTML=qs.map((q,i)=>`<div class="quiz-q"><div class="section-title"><b>Tanong ${i+1}</b><button class="btn danger small" onclick="qs.splice(${i},1);renderQs()">Alisin</button></div>
<input placeholder="Tanong" oninput="qs[${i}].q=this.value" value="${esc(q.q)}"><input placeholder="A" oninput="qs[${i}].a=this.value" value="${esc(q.a)}"><input placeholder="B" oninput="qs[${i}].b=this.value" value="${esc(q.b)}"><input placeholder="C" oninput="qs[${i}].c=this.value" value="${esc(q.c)}"><input placeholder="D" oninput="qs[${i}].d=this.value" value="${esc(q.d)}"><select onchange="qs[${i}].ans=this.value"><option ${q.ans==='A'?'selected':''}>A</option><option ${q.ans==='B'?'selected':''}>B</option><option ${q.ans==='C'?'selected':''}>C</option><option ${q.ans==='D'?'selected':''}>D</option></select></div>`).join("")||`<p class="muted">Wala pang quiz question.</p>`}
async function publishLesson(){
let title=$("ltitle").value.trim(),content=$("lcontent").value.trim(),code=$("lcode").value.trim().toUpperCase();
if(!title||!content||!code)return $("formMsg").innerHTML=notice("Punan ang pamagat, nilalaman, at section/join code.",true);
if(qs.some(q=>!q.q||!q.a||!q.b||!q.c||!q.d))return $("formMsg").innerHTML=notice("Punan ang lahat ng quiz fields.",true);
let img="";let f=$("photo").files[0];
if(f){if(f.size>3*1024*1024)return $("formMsg").innerHTML=notice("Maximum 3MB ang cover photo.",true);img=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
db.lessons.push({id:Date.now().toString(),title,content,code,image:img,video:$("video").value.trim(),quiz:JSON.parse(JSON.stringify(qs)),created:new Date().toISOString()});save();qs=[];alert("Matagumpay na na-post ang aralin!");teacher()
}
window.publishLesson=publishLesson;
function deleteLesson(i){if(confirm("Tanggalin ang aralin?")){db.lessons.splice(i,1);save();teacher()}}
function studentManager(){return `<div class="card">${header("Mga Mag-aaral","Mga estudyanteng gumamit ng join code.")}${db.students.length?`<table><tr><th>Pangalan</th><th>Join Code</th></tr>${db.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.code)}</td></tr>`).join("")}</table>`:"<p class='muted'>Wala pang estudyante.</p>"}</div>`}
render()}
function student(){
topUser();let code=sessionStorage.getItem("code"),name=sessionStorage.getItem("name");
let ls=db.lessons.filter(l=>l.code===code);
$("app").innerHTML=`<div class="wrap"><div class="nav"><button class="btn secondary" onclick="student()">📚 Mga Aralin</button><button class="btn secondary" onclick="logout()">Logout</button></div>
<div class="card">${header("Mag-aaral Dashboard",`Hi, ${name} · Section: ${code}`)}${ls.length?ls.map((l,i)=>studentLesson(l,i)).join(""):`<p class="muted">Wala pang aralin para sa join code na ito.</p>`}</div></div>`}
function studentLesson(l,i){return `<article class="lesson"><h3>${esc(l.title)}</h3>${l.image?`<img src="${l.image}">`:""}<p>${esc(l.content)}</p>${l.video?`<p><b>Video:</b> <a href="${esc(l.video)}" target="_blank" style="color:#7deee7">Buksan ang video</a></p>`:""}${l.quiz.length?`<button class="btn small" onclick="takeQuiz('${l.id}')">Sagutan ang Quiz (${l.quiz.length} items)</button>`:""}</article>`}
function takeQuiz(id){let l=db.lessons.find(x=>x.id===id);let qs=l.quiz;$("app").innerHTML=`<div class="wrap"><div class="card">${header("Quiz",l.title)}<form id="quizForm">${qs.map((q,i)=>`<div class="quiz-q"><b>${i+1}. ${esc(q.q)}</b>${["A","B","C","D"].map(x=>`<label class="option"><input type="radio" name="q${i}" value="${x}"> ${x}. ${esc(q[x.toLowerCase()])}</label>`).join("")}</div>`).join("")}</form><div class="actions"><button class="btn" onclick="submitQuiz('${id}')">Submit Quiz</button><button class="btn secondary" onclick="student()">Bumalik</button></div></div></div>`}
function submitQuiz(id){let l=db.lessons.find(x=>x.id===id),score=0;for(let i=0;i<l.quiz.length;i++){let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&a.value===l.quiz[i].ans)score++}let name=sessionStorage.getItem("name");db.scores.push({name,lesson:l.title,score,total:l.quiz.length,date:new Date().toISOString()});save();$("app").innerHTML=`<div class="wrap"><div class="card center">${header("Quiz Result")}<h1>${score} / ${l.quiz.length}</h1><p class="muted">Naitala na ang iyong score.</p><button class="btn" onclick="student()">Bumalik sa Aralin</button></div></div>`}
function $(id){return document.getElementById(id)}
window.home=home;window.login=login;window.enter=enter;window.logout=logout;window.teacher=teacher;window.student=student;window.takeQuiz=takeQuiz;window.submitQuiz=submitQuiz;window.deleteLesson=deleteLesson;home();
</script>
</body>
</html>
